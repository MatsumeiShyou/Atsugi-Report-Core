name: Atsugi Daily Report

on:
  schedule:
    # 毎日UTC 15:00 (JST 0:00)
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      target_yyyymm:
        description: '対象年月 (例: 2026-05)。未指定の場合は最新データから自動判定。'
        required: false
        type: string
permissions:
  contents: read
  id-token: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TARGET_FOLDER_ID: ${{ vars.TARGET_FOLDER_ID }}
          TARGET_SPREADSHEET_ID: ${{ vars.TARGET_SPREADSHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_YYYYMM: ${{ github.event.inputs.target_yyyymm }}
        run: python src/main.py
